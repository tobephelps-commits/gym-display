<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1920, height=1080, initial-scale=1.0">
  <title>Gym Display</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="zone-wod" class="zone zone-wod">
    <iframe id="wod-iframe" src="" class="wod-display wod-iframe hidden"></iframe>
    <div id="wod-loading" class="wod-display wod-loading">Connecting to WODscreen...</div>
    <div id="wod-error" class="wod-display wod-error hidden">WOD temporarily unavailable</div>
  </div>

  <div id="zone-video" class="zone zone-video">
    <div id="yt-container"></div>
    <video id="reels-player" class="video-display hidden" muted autoplay playsinline></video>
    <div id="video-no-content" class="video-display hidden">No videos configured</div>
  </div>

  <div id="zone-roster" class="zone zone-roster">
    <!-- Loading state -->
    <div id="roster-loading" class="roster-state">Loading roster...</div>

    <!-- No class active state -->
    <div id="roster-empty" class="roster-state hidden">
      <div class="roster-empty-message">No class in session</div>
    </div>

    <!-- Active roster display -->
    <div id="roster-display" class="roster-state hidden">
      <div class="roster-header">
        <div id="roster-class-name" class="roster-class-name"></div>
        <div id="roster-class-meta" class="roster-class-meta"></div>
      </div>
      <div id="roster-grid" class="roster-grid"></div>
      <div id="roster-count" class="roster-count"></div>
    </div>

    <!-- Error/unconfigured state -->
    <div id="roster-error" class="roster-state hidden">
      <div class="roster-empty-message">Roster unavailable</div>
    </div>
  </div>

  <div id="zone-leaderboard" class="zone zone-leaderboard">
    <div id="leaderboard-loading" class="leaderboard-state">
      <p>Loading leaderboard...</p>
    </div>
    <div id="leaderboard-display" class="leaderboard-state hidden">
      <div class="leaderboard-header">
        <h1 id="leaderboard-title">CROSSFIT OPEN</h1>
      </div>
      <div id="leaderboard-teams" class="leaderboard-teams">
        <!-- Populated dynamically by app.js -->
      </div>
    </div>
    <div id="leaderboard-empty" class="leaderboard-state hidden">
      <p>No active competition</p>
    </div>
  </div>

  <div id="zone-announcements" class="zone zone-announcements">
    <div id="announcements-loading" class="announcements-state">
      <p>Loading announcements...</p>
    </div>
    <div id="announcements-display" class="announcements-state hidden">
      <div class="announcements-header">
        <h1 id="announcements-title">ANNOUNCEMENTS</h1>
      </div>
      <div id="announcements-list" class="announcements-list">
        <!-- Populated dynamically by app.js -->
      </div>
    </div>
    <div id="announcements-empty" class="announcements-state hidden">
      <p>No announcements</p>
    </div>
  </div>

  <script src="app.js"></script>
  <script>
    // Load YouTube IFrame API asynchronously so it never blocks page init
    (function() {
      var tag = document.createElement('script');
      tag.src = 'https://www.youtube.com/iframe_api';
      var firstScript = document.getElementsByTagName('script')[0];
      firstScript.parentNode.insertBefore(tag, firstScript);
    })();
  </script>
</body>
</html>
