<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1920, height=1080, initial-scale=1.0">
  <title>Gym Display</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="zone-wod" class="zone zone-wod">
    <iframe id="wod-iframe" src="" class="wod-display wod-iframe hidden" sandbox="allow-scripts allow-same-origin"></iframe>
    <img id="wod-screenshot" src="" class="wod-display wod-screenshot hidden" alt="WOD Screenshot">
    <div id="wod-loading" class="wod-display wod-loading">Loading WOD...</div>
    <div id="wod-error" class="wod-display wod-error hidden">WOD temporarily unavailable</div>
  </div>

  <div id="zone-video" class="zone zone-video">
    <div class="zone-placeholder">
      <h1>Video Zone</h1>
    </div>
  </div>

  <div id="zone-roster" class="zone zone-roster">
    <div class="zone-placeholder">
      <h1>Roster Zone</h1>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
