# ── Gym Display System Configuration ──
# Copy this file to config.yaml and fill in your credentials:
#   cp config.example.yaml config.yaml

# WodScreen / Beyond The Whiteboard
wodscreen:
  url: "https://www.wodscreen.com"
  username: "your_email@example.com"
  password: "your_password"
  refresh_interval_minutes: 30
  screenshot_selector: "#workout-display"

# Display Zone Rotation
zones:
  rotation_order: ["wod", "video", "roster", "leaderboard", "announcements"]
  wod:
    duration_seconds: 120
  video:
    play_full: true
    fallback_seconds: 180
  roster:
    duration_seconds: 60
    boost_before_class_minutes: 15
    boost_frequency: 2
  # Leaderboard Zone: Reads from Sheets "Leaderboard" tab
  # Tab columns: Name, Team, Points (optional: Title on first row overrides config)
  # Teams: Green, Blue, Red (case-insensitive)
  # Zone auto-skips when tab is empty or Sheets not configured
  leaderboard:
    duration_seconds: 90

# Leaderboard settings
leaderboard:
  title: "CROSSFIT OPEN"  # Display title (overridden by Sheets "Title" column if present)
  # Announcements Zone: Reads from Sheets "Announcements" tab
  # Tab columns: Title, Body, Active (TRUE/FALSE), Priority (optional: urgent/normal)
  # Zone auto-skips when no active announcements or Sheets not configured
  announcements:
    duration_seconds: 60

# Video Playlist
# Primary source: Google Sheets "Playlist" tab (when Sheets is configured)
# Fallback source: videos list below (when Sheets not configured)
# Sheets tab format: columns "url", "title", "enabled" (TRUE/FALSE), "days" (optional), "focus" (optional)
# Both YouTube and Instagram reel URLs are supported in the Sheets tab
# YouTube URLs play via iframe; Instagram URLs are downloaded as reels
# Day-of-week scheduling: "days" column accepts comma-separated day abbreviations
#   e.g. "Mon,Wed,Fri" — leave blank to play every day
#   Valid values: Mon, Tue, Wed, Thu, Fri, Sat, Sun (case-insensitive)
# Focus mode: set "focus" to true to highlight a video — it plays every other rotation.
#   Multiple focus videos alternate in the focus slot. Non-focus videos fill the remaining slots.
videos:
  - url: "https://www.youtube.com/watch?v=82jNjDS19lg"
    title: "Double Under Demo"
    enabled: true
    days: "Mon,Wed,Fri"
    focus: false
  - url: "https://www.youtube.com/watch?v=QABW99qPiNM&pp=ygURYmlyZGRvZ3MgZXhlcmNpc2U%3D"
    title: "Bird Dogs"
    enabled: true
    focus: false
    # days: ""  # Blank or omitted = plays every day

# MindBody Integration
mindbody:
  api_key: "your_api_key"
  site_id: "99"
  source_name: "ICWA"
  username: "your_email@example.com"
  password: "your_password"
  poll_interval_minutes: 5

# Instagram Reels (visual fallback) — uses instaloader, no login required
instagram:
  enabled: true
  username: "bigbarncrossfit"
  max_reels: 10
  fetch_interval_minutes: 60
  min_display_seconds: 30

# Google Sheets Integration (data hub for leaderboard, announcements, playlists)
sheets:
  spreadsheet_id: "your_spreadsheet_id"
  service_account_email: "your-service@project-id.iam.gserviceaccount.com"
  credentials_file: "/home/BigBarn/secrets/google-credentials.json"
  poll_interval_minutes: 5

# Live Events (via Google Sheets "LiveEvent" tab)
# Columns: Title, URL (YouTube Live), Start (YYYY-MM-DD HH:MM), End (YYYY-MM-DD HH:MM), Enabled (TRUE/FALSE)
# When an enabled event's time window includes now, rotation is overridden with fullscreen YouTube Live
# Multiple events can be scheduled; first matching active event wins
# Times are interpreted in the system.timezone setting

# System
system:
  port: 3000
  log_level: "info"
  timezone: "America/Denver"
  screen_off_start: "21:00"
  screen_off_end: "04:30"
  # Optional: admin panel auth token. If not set, admin panel has open access (fine for local Pi).
  # Set this if the Pi is accessible from outside the local network.
  # admin_token: "your_secret_token"

# Alerts (v1.3 — Tiered Alert System)
# Critical alerts: Pushover push notifications (wake-up capable)
# Warning alerts: Email via Gmail
# Leave sections unconfigured to disable that channel
alerts:
  # Pushover for critical alerts (all zones down, persistent failures)
  # Sign up at pushover.net, buy app ($4.99 one-time)
  pushover:
    user_key: ""          # Your Pushover user key
    app_token: ""         # Your Pushover application token

  # Email for warning alerts (single zone down, degraded zones)
  # Uses Gmail with App Password — generate at Google Account > Security > App Passwords
  email:
    gmail_user: ""        # e.g. yourname@gmail.com
    gmail_app_password: "" # 16-character App Password (NOT your regular password)
    recipients:           # Who receives warning emails
      - ""                # e.g. owner@gmail.com

  # Alert thresholds (defaults are sensible, adjust if needed)
  thresholds:
    min_failures_warning: 1       # Consecutive failures before WARNING
    min_failures_critical: 3      # Consecutive failures before CRITICAL
    cooldown_critical_minutes: 30  # Don't re-alert CRITICAL for same issue within this window
    cooldown_warning_minutes: 120  # Don't re-alert WARNING for same issue within this window
    batch_window_seconds: 30       # Collect warnings for this long, send as digest
    recovery_threshold: 2          # Consecutive healthy checks before "all clear" notification
    suppressed_zones: []           # Zones to silence alerts for, e.g. [roster, leaderboard]

# Zone Health Monitoring (v1.3)
health:
  check_interval_seconds: 60      # How often to check zone health
  staleness_minutes: 10           # Data older than this triggers degraded status
  max_consecutive_failures: 5     # Consecutive failures before marking unhealthy
